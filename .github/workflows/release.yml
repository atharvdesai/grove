name: Release

# Push a tag that matches VERSION (e.g. v0.2.0) and this builds Grove.dmg and
# Grove.zip, attaches them to a GitHub Release, and updates the Homebrew tap.
#
#   echo 0.2.0 > VERSION && ./scripts/sync-version.sh
#   git commit -am "Release 0.2.0" && git tag v0.2.0 && git push --tags
#
# Every secret below is optional. With none set, you get an unsigned release
# (users approve it once in System Settings). Add the signing ones later and
# the same workflow signs and notarizes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      GROVE_GOOGLE_CLIENT_ID: ${{ secrets.GROVE_GOOGLE_CLIENT_ID }}
      # Signing — Developer ID certificate exported as .p12, base64-encoded.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
      # Notarization — an app-specific password from appleid.apple.com.
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      # Homebrew — a token that can push to atharvdesai/homebrew-grove.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)" \
            || { echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION $(cat VERSION)"; exit 1; }

      - name: Signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/cert.p12"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials grove --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "NOTARY_PROFILE=grove" >> "$GITHUB_ENV"
          fi

      - name: Build Grove.dmg and Grove.zip
        run: ./scripts/release.sh

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          NOTES="Download **Grove.dmg**, open it, and drag Grove into Applications.

          Requires macOS 26 or later on Apple Silicon."
          if [ -z "$DEVELOPER_ID" ]; then
            NOTES="$NOTES

          **First launch:** this build isn't signed by Apple yet. If macOS says it can't verify Grove, open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway**. You only do this once."
          fi
          gh release create "v$VERSION" dist/Grove.dmg dist/Grove.zip \
            "dist/Grove-$VERSION.dmg" "dist/Grove-$VERSION.zip" \
            --title "Grove $VERSION" --notes "$NOTES" --latest

      - name: Update the Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SHA="$(shasum -a 256 dist/Grove.zip | cut -d' ' -f1)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/atharvdesai/homebrew-grove.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA/" \
            packaging/homebrew/grove.rb > tap/Casks/grove.rb
          cd tap
          git config user.name "Atharv Desai"
          git config user.email "52047948+atharvdesai@users.noreply.github.com"
          git add Casks/grove.rb
          git commit -m "Grove $VERSION"
          git push
